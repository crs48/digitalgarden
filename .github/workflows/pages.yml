name: Publish garden
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: garden-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      GARDEN_DISPLAY_NAME: ${{ vars.GARDEN_DISPLAY_NAME }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Bluesky handle
        run: node --input-type=module -e "import { normalizeHandle } from './scripts/data.mjs'; normalizeHandle(process.env.BLUESKY_HANDLE);"
      - run: npm test
      - name: Collect garden posts and profile
        id: sync
        continue-on-error: true
        run: npm run sync
      - name: Report import outage
        if: steps.sync.outcome == 'failure'
        run: echo '::warning::Bluesky import failed. The build will use the saved snapshot only if its profile matches BLUESKY_HANDLE.'
      - run: npm run build
      - name: Save the profile and garden snapshot
        if: steps.sync.outcome == 'success'
        run: |
          if ! git diff --quiet -- content/garden.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/garden.json
            git commit -m 'content: sync the Bluesky garden' -m '- Refresh the public profile and current posts tagged #garden.'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
