name: Publish garden
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: garden-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect Bluesky links
        id: sync
        continue-on-error: true
        run: npm run sync
      - name: Report import outage
        if: steps.sync.outcome == 'failure'
        run: echo '::warning::Bluesky import failed. Publishing the last saved collection.'
      - run: npm run build
      - name: Save imported links to the repository
        if: steps.sync.outcome == 'success'
        run: |
          if ! git diff --quiet -- content/bluesky.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/bluesky.json
            git commit -m 'content: collect links from Bluesky' -m '- Preserve imported links in the garden archive.'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
