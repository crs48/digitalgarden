# yaml-language-server: $schema=./garden.schema.json
# Your whole garden lives here. Add a link, commit, and GitHub Pages does the rest.
site:
  title: Digital garden
  owner: Chris
  home: https://crs.land
  heading: Things worth returning to.
  description: A growing collection of ideas, discoveries, and different ways of seeing. Somewhere between a library and a field notebook.
  accent: '#2458d3'
  repository: https://github.com/crs48/digitalgarden

# Add, rename, or remove categories freely. Entry categories also appear automatically.
categories: [Talks, Papers, Essays, Books, Movies, TV shows, Links]

bluesky:
  enabled: true
  handle: crs.land
  mode: hashtag             # hashtag | all-links | manual
  hashtag: garden
  defaultCategory: Links
  categoryTags:
    talk: Talks
    video: Talks
    paper: Papers
    essay: Essays
    book: Books
    movie: Movies
    tv: TV shows
  excludeUrls: []            # Ignore a link here, including an earlier import.

# These are EXAMPLES, not a claim about your personal favorites.
# Replace them with your own links. Remove `example: true` from links you keep.
# Only title and url are required. Tags and categories are entirely up to you.
entries:
  - title: Inventing on Principle
    url: https://vimeo.com/906418692
    creator: Bret Victor
    category: Talks
    year: 2012
    note: What would it mean to build your work around a principle? A talk about creative tools and a more immediate connection to what we make.
    tags: [programming, creativity]
    thumbnail: https://worrydream.com/Home2024/previews/Inventing_on_Principle.jpg
    added: 2026-09-25
    example: true

  - title: Local-first software
    url: https://www.inkandswitch.com/essay/local-first/
    creator: Ink & Switch
    category: Papers
    year: 2019
    note: Seven ideals for software that keeps working offline, supports collaboration, and leaves ownership with the people using it.
    tags: [programming, distributed-data]
    added: 2026-09-25
    example: true

  - title: How to Do Nothing
    url: https://www.penguinrandomhouse.com/books/600671/how-to-do-nothing-by-jenny-odell
    creator: Jenny Odell
    category: Books
    year: 2019
    note: A reconsideration of attention, place, and what it means to spend a life well.
    tags: [attention, being-human]
    added: 2026-09-25
    example: true

  - title: Simple Made Easy
    url: https://www.infoq.com/presentations/Simple-Made-Easy/
    creator: Rich Hickey
    category: Talks
    year: 2011
    note: Separating simplicity from familiarity, and learning to notice the complexity we introduce into our systems.
    tags: [programming, systems]
    added: 2026-09-25
    example: true

  - title: Awareness Through Movement
    url: https://feldenkrais.com/awareness-movement-atm-classes/
    creator: Feldenkrais Guild of North America
    category: Essays
    note: An introduction to exploring movement through attention, curiosity, and small variations.
    tags: [body, movement, attention]
    added: 2026-09-25
    example: true

  - title: Learnable Programming
    url: https://worrydream.com/LearnableProgramming/
    creator: Bret Victor
    category: Essays
    year: 2012
    note: Programming environments designed to help us see, understand, and explore what a program is doing.
    tags: [programming, creativity, learning]
    thumbnail: https://worrydream.com/Home2024/previews/Learnable_Programming.jpg
    added: 2026-09-25
    example: true
